# coturn TURN server configuration
listening-port=3478
tls-listening-port=5349

# Use fingerprint for TURN messages
fingerprint

# Long-term credential mechanism
lt-cred-mech

# Realm (set to your domain)
realm=${TURN_REALM:-claw.example.com}

# Static user credentials (override via env)
user=${TURN_USER:-clawgame}:${TURN_PASSWORD:-changeme}

# Total relay bandwidth limit (bytes/s), 0 = unlimited
total-quota=100

# Per-session bandwidth limit
bps-capacity=0

# Logging
log-file=stdout
verbose

# Allowed peer IPs for relay (restrict in production)
no-multicast-peers

# SSL (uncomment and set paths for production)
# cert=/etc/ssl/certs/turn.pem
# pkey=/etc/ssl/private/turn.key
